[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "openclaw-agent-core"
version = "0.1.0"
description = "Safe shared subprocess client for OpenClaw agent lifecycle tools"
readme = "README.md"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["openclaw_agent_core"]

[tool.pytest.ini_options]
testpaths = ["skills/openclaw-agent-admin/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
